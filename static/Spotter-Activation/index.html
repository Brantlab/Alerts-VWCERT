<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="theme-color" content="#12344b">
  <title>Spotter Activation Check-In</title>
  <link rel="stylesheet" href="../css/spotter-activation.css">
</head>
<body>
  <main class="spotter-shell">
    <section class="spotter-card">
      <p class="eyebrow">Van Wert County EMA</p>
      <h1>Spotter Activation</h1>
      <p id="incident-status" class="incident-status">Checking active incident...</p>

      <label class="department-picker">
        Department
        <select id="department" required>
          <option value="">Select department</option>
          <option>Convoy</option>
          <option>Willshire</option>
          <option>Wren</option>
          <option>Ohio City</option>
          <option>Middle Point</option>
          <option>Scott</option>
          <option>Van Wert</option>
          <option>CERT</option>
          <option>Amateur</option>
        </select>
      </label>

      <form id="spotter-form">
        <label>
          Unit number
          <input id="unit-number" type="text" autocomplete="off" placeholder="Example: 101, Engine 2, CERT 4" required>
        </label>
        <label>
          Current location
          <input id="location" type="text" autocomplete="off" placeholder="Road/intersection, station, or assignment">
        </label>
        <label>
          Status
          <select id="status">
            <option>Available</option>
            <option>Monitoring</option>
            <option>En route</option>
            <option>On scene</option>
            <option>Unavailable</option>
          </select>
        </label>
        <button id="submit-button" type="submit">Add Unit</button>
      </form>

      <p id="save-status" class="save-status" role="status">Select your department, then add each responding unit.</p>
      <section class="active-units">
        <h2>Checked-In Units</h2>
        <div id="unit-list" class="unit-list"></div>
      </section>
    </section>
  </main>

  <dialog id="edit-unit-dialog" class="edit-unit-dialog">
    <form id="edit-unit-form" method="dialog">
      <div class="dialog-heading">
        <h2>Edit Unit</h2>
        <button class="icon-button" type="button" data-close-dialog="edit-unit-dialog" aria-label="Close">×</button>
      </div>
      <input id="edit-unit-id" type="hidden">
      <label>
        Unit number
        <input id="edit-unit-number" type="text" required>
      </label>
      <label>
        Current location
        <input id="edit-location" type="text">
      </label>
      <label>
        Status
        <select id="edit-status">
          <option>Available</option>
          <option>Monitoring</option>
          <option>En route</option>
          <option>On scene</option>
          <option>Unavailable</option>
        </select>
      </label>
      <div class="dialog-actions">
        <button id="delete-unit" class="danger-button" type="button">Remove</button>
        <button class="secondary-button" type="button" data-close-dialog="edit-unit-dialog">Cancel</button>
        <button id="save-unit" type="submit">Save</button>
      </div>
    </form>
  </dialog>
  <script type="module" src="../js/spotter-activation.js"></script>
</body>
</html>
